{% extends 'base.html' %}
{% block title %}{% if carrera %}Editar{% else %}Nueva{% endif %} Carrera{% endblock %}

{% block content %}
<div class="glass-card" style="max-width: 600px; margin: 0 auto;">
    <h2>{% if carrera %}Editar{% else %}Nueva{% endif %} Carrera</h2>
    <hr style="border:0; border-top:1px solid var(--glass-border); margin: 20px 0;">
    
    <form method="POST">
        <div class="form-group">
            <label class="form-label">Nombre de la Carrera</label>
            <input type="text" name="nombre" class="glass-input" value="{{ carrera.nombre if carrera else '' }}" required>
        </div>
        
        <div class="form-group">
            <label class="form-label">Prefijo ID (Número)</label>
            <input type="number" name="prefijo_id" class="glass-input" value="{{ carrera.prefijo_id if carrera else '' }}" required>
            <small class="text-muted" style="display:block; margin-top:5px;">Este número se usa para generar el expediente (ej: 4 = Logística).</small>
        </div>
        
        <div style="display: flex; gap: 10px; margin-top: 30px;">
            <a href="{{ url_for('admin.carreras') }}" class="glass-btn glass-btn-outline">Cancelar</a>
            <button type="submit" class="glass-btn">Guardar</button>
        </div>
    </form>
</div>
{% endblock %}
