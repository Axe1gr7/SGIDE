services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migration_vinculacion.sql:/docker-entrypoint-initdb.d/1_migration_vinculacion.sql
      - ./migration_practicas.sql:/docker-entrypoint-initdb.d/2_migration_practicas.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: always
    command: ["sh", "./entrypoint.sh"]
    ports:
      - "80:5000"
    volumes:
      - uploads_data:/uploads
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - UPLOAD_FOLDER=/uploads

volumes:
  pgdata:
  uploads_data: